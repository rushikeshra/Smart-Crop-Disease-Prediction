{% extends "base.html" %}

{% block title %}Internal Server Error (500) - Smart Crop System{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="py-5">
        <div class="stat-icon bg-danger-subtle text-danger mx-auto mb-3" style="width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <i class="fa-solid fa-triangle-exclamation fs-1"></i>
        </div>
        <h1 class="display-4 fw-bold text-dark mb-2">500</h1>
        <h3 class="fw-bold text-dark mb-3">Internal Server Error</h3>
        <p class="text-muted col-md-6 mx-auto mb-4">
            An unexpected error occurred while processing your request. Please try again later.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-forest px-4 py-2 fw-semibold">
            <i class="bi bi-speedometer2 me-1"></i> Back to Dashboard
        </a>
    </div>
</div>
{% endblock %}
