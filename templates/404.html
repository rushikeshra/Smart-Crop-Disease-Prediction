{% extends "base.html" %}

{% block title %}Page Not Found (404) - Smart Crop System{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="py-5">
        <div class="stat-icon bg-warning-subtle text-warning mx-auto mb-3" style="width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
            <i class="fa-solid fa-leaf-slash fs-1"></i>
        </div>
        <h1 class="display-4 fw-bold text-dark mb-2">404</h1>
        <h3 class="fw-bold text-dark mb-3">Page Not Found</h3>
        <p class="text-muted col-md-6 mx-auto mb-4">
            The page you are looking for does not exist or may have been moved.
        </p>
        <a href="{{ url_for('index') }}" class="btn btn-forest px-4 py-2 fw-semibold">
            <i class="bi bi-house-door me-1"></i> Return to Home
        </a>
    </div>
</div>
{% endblock %}
